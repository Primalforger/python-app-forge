[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-app-forge"
version = "0.1.0"
description = "Local-first, componentized Python application engineering platform (CLI + optional PySide6 GUI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42", "PyYAML>=6.0.2"]  # Ed25519 component artifact signatures

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
table-xlsx = ["openpyxl>=3.1"]
table-pdf = ["reportlab>=4"]
table-export = ["openpyxl>=3.1", "reportlab>=4"]
keyring = ["keyring>=25"]
migrations = ["SQLAlchemy>=2.0", "alembic>=1.13"]
sqlite = ["SQLAlchemy>=2.0"]
postgres = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.2"]
prometheus = ["prometheus-client>=0.20"]
dev = ["pytest>=8", "ruff", "mypy", "jsonschema>=4.25", "SQLAlchemy>=2.0", "prometheus-client>=0.20"]

[project.scripts]
forge = "app_forge.cli.main:main"

[project.gui-scripts]
forge-gui = "app_forge.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_forge = ["data/**/*"]

[tool.ruff]
# Built-in templates intentionally contain unresolved placeholders and are not valid Python/TOML yet.
extend-exclude = ["src/app_forge/data/**"]

[tool.ruff.lint]
# Enforce high-confidence correctness checks first; adopt style rules incrementally.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# Component payloads are templates/artifacts, not Python source for the platform.
exclude = ["src/app_forge/data/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.forge.verify]
# Template and component payloads contain {{placeholders}}; they are not importable Python until rendered.
exclude = ["src/app_forge/data/"]
