schema_version = 1

[template]
id = "web-fastapi"
name = "Web application / API (FastAPI)"
version = "1.0.0"
archetype = "web"
summary = "FastAPI service with JWT authentication, RBAC, defensive middleware and operational endpoints."

[dependencies]
python_packages = ["fastapi>=0.110", "uvicorn>=0.29", "PyJWT[crypto]>=2.8"]
dev_packages = ["pytest>=8", "httpx>=0.27"]

[entry]
module = "api"
function = "main"
